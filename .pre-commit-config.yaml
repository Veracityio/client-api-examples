repos:
-   repo: local
    hooks:
    -   id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --show-fixes
        language: system
        types_or: [ python, pyi, pyproject ]
    -   id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [ python, pyi ]
